spring.application.name=agenciaconnectapi
server.port=8080

# createDatabaseIfNotExist=true crea automaticamente la base de datos bd_agenciaconnect en MySQL/XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/bd_agenciaconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

